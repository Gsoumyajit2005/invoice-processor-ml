[project]
name = "invoice-processor-workspace"
version = "2.0.0"
description = "Hybrid Document AI Invoice Processor workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["backend", "ml"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "modal>=1.6.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/**/*.py" = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["backend", "ml"]
exclude = [".venv", "**/.venv", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
