# docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-invoices_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres16_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-invoices_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres16_data:
