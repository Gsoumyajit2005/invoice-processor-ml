[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-ml"
version = "2.0.0"
description = "Eval-first benchmark and conditional QLoRA pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "invoice-backend[local-vlm]",
    "datasets>=3.2.0",
    "seqeval>=1.2.2",
    "python-doctr>=0.10.0",
    "opencv-python-headless>=4.10.0",
    "tqdm>=4.67.0",
]

[tool.uv.sources]
invoice-backend = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["eval", "train"]
