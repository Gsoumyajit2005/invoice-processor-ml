[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-backend"
version = "2.0.0"
description = "FastAPI backend & Document AI extraction pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "slowapi>=0.1.9",
    "boto3>=1.35.0",
    "httpx>=0.28.0",
    "litellm>=1.55.0",
    "indra-ocr>=1.1.2",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.4",
    "pillow>=11.0.0",
    "rapidfuzz>=3.10.0",
    "python-dateutil>=2.9.0",
    "huggingface-hub>=0.27.0",
]

[project.optional-dependencies]
local-vlm = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.8.1",
    "accelerate>=1.3.0",
    "bitsandbytes>=0.45.0",
    "peft>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
